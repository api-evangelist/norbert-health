aid: norbert-health
name: Norbert Health
description: >-
  Norbert Health, Inc. builds "Norbert", an autonomous care manager for nursing homes and
  rehabilitation facilities — a robot-mounted or tabletop AI module that plans rounding
  schedules, contactlessly senses patient vitals and behavior, and writes clinical notes
  without additional staff. Its multimodal sensing stack captures pulse and respiratory
  rate, room presence and activity, mobility and gait, environmental context, and
  cognitive signals from vocal biomarkers, then turns them into tasks, role-specific
  alerts, and structured EMR notes. Founded in 2019 by Alexandre Winter with offices in
  Brooklyn, Paris, and Montreal, the company raised a $5M Seed II in 2021 co-led by Serena
  Capital and HCVC. The device is investigational and limited by US federal law to
  investigational use pending FDA clearance. Norbert Health publishes no public API,
  developer portal, or machine-readable contract; integration is arranged through a sales
  conversation.
